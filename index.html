<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yu-Gi-Oh! Card Scanner MVP</title>
    
    <meta name="theme-color" content="#FF0055">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #111111;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            color: #FF0055;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Scanner Viewport Container */
        .scanner-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 3 / 4;
            background-color: #000000;
            border: 3px solid #333333;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Overlay Guide representing the Card frame */
        .card-overlay {
            position: absolute;
            top: 10%;
            left: 10%;
            width: 80%;
            height: 80%;
            border: 2px dashed #FF0055;
            border-radius: 8px;
            pointer-events: none;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4);
        }

        /* Target indicator for the Passcode at bottom left */
        .passcode-target {
            position: absolute;
            bottom: 4%;
            left: 4%;
            width: 30%;
            height: 6%;
            border: 2px solid #00FFCC;
            background-color: rgba(0, 255, 204, 0.1);
        }

        .controls {
            margin-top: 20px;
            width: 100%;
            max-width: 400px;
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-scan {
            background-color: #FF0055;
            color: white;
        }

        .btn-scan:disabled {
            background-color: #555555;
            cursor: not-allowed;
        }

        /* Results Display Card */
        .result-panel {
            margin-top: 20px;
            width: 100%;
            max-width: 400px;
            background-color: #222222;
            border-radius: 8px;
            padding: 15px;
            display: none;
            border-left: 4px solid #00FFCC;
        }

        .result-panel h2 {
            font-size: 1.2rem;
            margin-bottom: 5px;
            color: #00FFCC;
        }

        .result-meta {
            font-size: 0.9rem;
            color: #aaaaaa;
            margin-bottom: 10px;
        }

        .price-tag {
            font-size: 1.2rem;
            font-weight: bold;
            color: #FFD700;
        }

        /* Hidden canvas used mechanically for frame cropping */
        canvas {
            display: none;
        }

        .status-msg {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #888888;
            text-align: center;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

    <header>
        <h1>Duel Scanner Pro</h1>
        <p class="status-msg" id="status">Initializing system APIs...</p>
    </header>

    <div class="scanner-container">
        <video id="video-preview" autoplay playsinline muted></video>
        <div class="card-overlay">
            <div class="passcode-target"></div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-scan" id="scan-btn" disabled>ALIGN CARD & SCAN</button>
    </div>

    <div class="result-panel" id="result-panel">
        <h2 id="card-name">Card Name Holder</h2>
        <p id="card-desc" class="result-meta">Card description text will load right here.</p>
        <div class="price-tag" id="card-price">TCGPlayer Avg: $0.00</div>
    </div>

    <canvas id="processing-canvas"></canvas>

    <script>
        const video = document.getElementById('video-preview');
        const canvas = document.getElementById('processing-canvas');
        const scanBtn = document.getElementById('scan-btn');
        const statusMsg = document.getElementById('status');
        const resultPanel = document.getElementById('result-panel');
        
        const cardNameDisplay = document.getElementById('card-name');
        const cardDescDisplay = document.getElementById('card-desc');
        const cardPriceDisplay = document.getElementById('card-price');

        let ocrWorker = null;

        // Initialize Tesseract OCR Worker
        async function initOCR() {
            statusMsg.innerText = "Loading Core OCR Engine...";
            ocrWorker = await Tesseract.createWorker('eng');
            // Configure to only look for numeric digits (0-9) to optimize passcode extraction speed
            await ocrWorker.setParameters({
                tessedit_char_whitelist: '0123456789',
            });
            statusMsg.innerText = "Scanner Ready.";
            scanBtn.disabled = false;
        }

        // Initialize Camera Hardware API
        async function startCamera() {
            try {
                const constraints = {
                    video: {
                        facingMode: { ideal: "environment" },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };
                
                // Browser API Handshake
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
            } catch (err) {
                console.error("Camera access denied: ", err);
                statusMsg.innerText = "Error: Camera permissions required.";
            }
        }

        // Primary Scanner Execution Pipeline
        async function executeScan() {
            scanBtn.disabled = true;
            statusMsg.innerText = "Analyzing frame...";
            resultPanel.style.display = "none";

            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // Step 1: Snapshot the frame onto the hidden canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            /* Step 2: Crop out the Passcode Target Box
               To keep this simple without heavy math, we will sample a localized snippet 
               from the bottom left region of the captured camera resolution frame.
            */
            const cropX = canvas.width * 0.15;
            const cropY = canvas.height * 0.78;
            const cropWidth = canvas.width * 0.25;
            const cropHeight = canvas.height * 0.10;

            const croppedCanvas = document.createElement('canvas');
            croppedCanvas.width = cropWidth;
            croppedCanvas.height = cropHeight;
            const croppedCtx = croppedCanvas.getContext('2d');
            
            croppedCtx.drawImage(canvas, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);

            try {
                // Step 3: Run the image frame crop through the Local Browser OCR API
                const { data: { text } } = await ocrWorker.recognize(croppedCanvas);
                const cleanedCode = text.replace(/\s+/g, '').trim();

                if (cleanedCode.length >= 4) {
                    statusMsg.innerText = `Detected Passcode: ${cleanedCode}. Querying DB...`;
                    await fetchCardData(cleanedCode);
                } else {
                    statusMsg.innerText = "Passcode blurred. Align bottom-left corner and retry.";
                    scanBtn.disabled = false;
                }
            } catch (ocrErr) {
                console.error(ocrErr);
                statusMsg.innerText = "Engine parsing error. Retry.";
                scanBtn.disabled = false;
            }
        }

        // Step 4: External API Request (YGOPRODECK Data Fetching)
        async function fetchCardData(passcode) {
            // Pad out leading zeros if the text parser drops them
            const paddedCode = passcode.padStart(8, '0');
            const apiEndpoint = `https://db.ygoprodeck.com/api/v7/cardinfo.php?id=${paddedCode}`;

            try {
                const response = await fetch(apiEndpoint);
                if (!response.ok) throw new Error("Card not located in global indexing.");
                
                const data = await response.json();
                const card = data.data[0];

                // Display Parsed API Assets out to UI Layout
                cardNameDisplay.innerText = card.name;
                cardDescDisplay.innerText = `${card.type} | ${card.race} \n\n${card.desc}`;
                
                const price = card.card_prices?.[0]?.tcgplayer_price || "N/A";
                cardPriceDisplay.innerText = `TCGPlayer Avg: $${price}`;
                
                resultPanel.style.display = "block";
                statusMsg.innerText = "Match Confirmed.";
            } catch (err) {
                statusMsg.innerText = `No profile found for ID: ${paddedCode}`;
            } finally {
                scanBtn.disabled = false;
            }
        }

        // Attach event triggers on bootup
        scanBtn.addEventListener('click', executeScan);
        window.addEventListener('DOMContentLoaded', () => {
            startCamera();
            initOCR();
        });
    </script>
</body>
</html>
